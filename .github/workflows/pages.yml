# Tests, builds and publishes the practice site (an index and one page per unit) to GitHub Pages on every push to main.
# Needs Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Check every unit meets its release minimums
        run: node tools/validate.js --release
      - run: npm run build
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp dist/index.html _site/index.html
          for dir in dist/unit-*/; do
            unit=$(basename "$dir")
            mkdir -p "_site/$unit"
            cp "$dir/local.html" "_site/$unit/index.html"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
