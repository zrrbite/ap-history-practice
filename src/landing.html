<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AP World History practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@400;500;600&family=IM+Fell+English&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>/*STYLES*/
.units { list-style: none; margin: 0; padding: 0; display: grid; gap: 1rem; }
.unit-card a { display: grid; gap: 0.25rem; padding: 1rem 1.1rem; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; color: var(--ink); text-decoration: none; }
.unit-card a:hover, .unit-card a:focus-visible { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 2px; }
.unit-name { font: 600 1.15rem/1.3 var(--font-display); }
.unit-period { color: var(--muted); }
.unit-counts { font: 400 0.875rem/1.4 var(--font-ui); color: var(--muted); }
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <p class="eyebrow">AP World History: Modern · AMSCO</p>
    <h1>Practice by unit</h1>
    <p class="lede">Choose a unit. Each has its own DBQs, short-answer questions and multiple-choice sets, built from real primary sources.</p>
  </header>
  <main>
    <ul class="units">
__UNITS__
    </ul>
  </main>
</div>
<script>/*FORWARD*/</script>
</body>
</html>
